# XcodeGen project specification. Regenerate with: xcodegen generate
name: Foyer
options:
  bundleIdPrefix: com.ralleur
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here or in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  FoyerCore:
    path: Packages/FoyerCore
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0

targets:
  Foyer:
    type: application
    platform: tvOS
    sources:
      - path: Foyer
        excludes:
          - "Resources/UITestFixtures/**"
      - path: Foyer/Resources/UITestFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: FoyerCore
        product: FoyerFoundation
      - package: FoyerCore
        product: JellyfinKit
      - package: FoyerCore
        product: PlaybackDecision
      - package: MPVKit
        product: MPVKit
    info:
      path: Foyer/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralleur.foyer
        PRODUCT_NAME: Foyer
        INFOPLIST_FILE: Foyer/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  FoyerTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: FoyerTests
    dependencies:
      - target: Foyer
      - package: FoyerCore
        product: FoyerFoundation
      - package: FoyerCore
        product: JellyfinKit
      - package: FoyerCore
        product: PlaybackDecision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralleur.foyer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Foyer.app/Foyer"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FoyerUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: FoyerUITests
    dependencies:
      - target: Foyer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralleur.foyer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Foyer

schemes:
  Foyer:
    build:
      targets:
        Foyer: all
        FoyerTests: [test]
        FoyerUITests: [test]
    run:
      config: Debug
      # MoltenVK + libplacebo trip Metal API validation on some HDR files; validation stays off for Run (MPVKit guidance).
      enableGPUValidationMode: disabled
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FoyerTests
        - FoyerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
